name: QueensGame
options:
  bundleIdPrefix: com.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  QueensGame:
    type: application
    platform: iOS
    sources:
      - path: QueensGame
    settings:
      base:
        INFOPLIST_FILE: QueensGame/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.app.queensgame
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES

  QueensGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QueensGameTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app.queensgame.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QueensGame

  QueensGameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QueensGameUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app.queensgame.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QueensGame

schemes:
  QueensGame:
    build:
      targets:
        QueensGame: all
        QueensGameTests: [test]
        QueensGameUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - QueensGameTests
        - QueensGameUITests
